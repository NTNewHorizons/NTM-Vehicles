// GitHub releases are the default distribution channel. Maven is opt-in.
if (providers.gradleProperty('publish_to_maven').getOrElse('false').toBoolean()) {
    def destination = providers.gradleProperty('maven_url').getOrElse('').trim()
    if (!destination) {
        throw new GradleException('publish_to_maven requires -Pmaven_url=https://your-repository/releases/')
    }
    publishing.repositories.maven {
        name = 'release'
        url = uri(destination)
        if (destination.startsWith('https://')) {
            credentials {
                username = providers.environmentVariable('MAVEN_USER').orNull
                password = providers.environmentVariable('MAVEN_PASS').orNull
            }
        } else if (!destination.startsWith('file:')) {
            throw new GradleException('Maven publishing requires HTTPS or a file: URL for dry runs.')
        }
    }
}
